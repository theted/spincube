<!doctype html>
<!-- Dev-only harness, not part of the build: SpinCube as the background of a
     stand-in for the sundbergsolutions.se hero, with the cube beside the
     wordmark. ?overrides=<json> adds setting overrides for experiments. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpinCube embed</title>
    <style>
      html {
        background: #0a0f1f;
      }
      body {
        margin: 0;
        color: #eef2ff;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(60vw 70vh at 12% 25%, #1d46b8, transparent 70%),
          radial-gradient(55vw 60vh at 85% 55%, #4b2a8a, transparent 70%),
          #0a0f1f;
        background-attachment: fixed;
      }
      .hero {
        position: relative;
        min-height: 100svh;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .hero-cube {
        position: absolute;
        inset: 0;
        z-index: 1;
        mask-image: linear-gradient(to bottom, #000 72%, transparent);
      }
      .hero-inner {
        position: relative;
        z-index: 3;
        width: 100%;
        max-width: 76rem;
        margin-inline: auto;
        padding: 6rem clamp(1.25rem, 5vw, 4rem);
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 14vw, 10rem);
        line-height: 0.86;
        font-weight: 300;
        letter-spacing: -0.03em;
      }
      h1 b {
        display: block;
        font-weight: 750;
      }
      .below {
        min-height: 100vh;
        padding: 4rem;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-cube" id="cube"></div>
      <div class="hero-inner">
        <h1>sundberg <b>solutions</b></h1>
      </div>
    </section>
    <div class="below">The page continues; check that it still scrolls.</div>
    <script type="module">
      import { mountSpinCube } from "/index.js";

      const extra = JSON.parse(
        new URLSearchParams(location.search).get("overrides") ?? "{}"
      );
      const overrides = {
        CAMERA: { minVisibleWidth: 0 },
        RENDER: { maxPixelRatio: 1.25, transmissionScale: 0.6 },
      };
      for (const [group, values] of Object.entries(extra)) {
        overrides[group] = { ...overrides[group], ...values };
      }

      window.spincube = mountSpinCube(document.getElementById("cube"), {
        background: "scene",
        layout: (width) =>
          width < 768 ? { x: 0.72, y: 0.24, zoom: 0.5 } : { x: 0.74, y: 0.47 },
        overrides,
      });
    </script>
  </body>
</html>
