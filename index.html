<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <meta
      name="description"
      content="A glass cube with a glowing S at its heart. Drag to spin it, hold to charge, release to pulse."
    />
    <title>Sundberg Solutions</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='8' fill='%230b0e18' stroke='%23c8d8ff' stroke-opacity='.5' stroke-width='3'/%3E%3Ctext x='32' y='45' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='38' text-anchor='middle' fill='%23ffb066'%3ES%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
      }
      .hint {
        position: fixed;
        z-index: 1;
        left: 0;
        right: 0;
        bottom: max(28px, env(safe-area-inset-bottom));
        margin: 0;
        text-align: center;
        font:
          500 12px/1.4 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #c8d8ff;
        opacity: 0;
        transition: opacity 1.2s ease;
        pointer-events: none;
        user-select: none;
      }
      .hint.visible {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <p id="hint" class="hint">drag to spin · hold to charge · scroll to zoom</p>
    <script type="module" src="/main.js"></script>
  </body>
</html>
